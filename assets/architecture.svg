<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 580" width="1260" height="580" role="img" aria-labelledby="arch-title arch-desc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="arch-title">Lead Engine architecture</title>
  <desc id="arch-desc">A human starts a run from the dashboard through the Flask API, which invokes the Strands agent on the Bedrock AgentCore runtime. The runtime calls Claude on Bedrock, reads its secrets from SSM Parameter Store at boot, and works through twelve tools. The tools read and write Supabase Postgres and call DataForSEO and SMTP. The dashboard reads progress, events and drafts back from the same database.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8799"/>
    </marker>
    <style>
      .bg  { fill:#0f1115 }
      .box { fill:#171a21; stroke:#2a2f3a; stroke-width:1.5; rx:10 }
      .aws { fill:#1a2230; stroke:#d29922; stroke-width:1.5; rx:10 }
      .hi  { fill:#1b2233; stroke:#4f8cff; stroke-width:1.5; rx:10 }
      .t   { fill:#e6e9ef; font-size:15px; font-weight:600; text-anchor:middle }
      .s   { fill:#9aa3b2; font-size:11.5px; text-anchor:middle }
      .lbl { fill:#9aa3b2; font-size:11px }
      .ln  { stroke:#7d8799; stroke-width:1.5; fill:none; marker-end:url(#a) }
    </style>
  </defs>

  <rect class="bg" width="1260" height="580"/>

  <!-- ============ the human ============ -->
  <rect class="box" x="30" y="240" width="150" height="80"/>
  <text class="t" x="105" y="275">Human</text>
  <text class="s" x="105" y="297">dashboard</text>

  <!-- ============ flask api ============ -->
  <rect class="box" x="250" y="240" width="170" height="80"/>
  <text class="t" x="335" y="275">Flask API</text>
  <text class="s" x="335" y="297">auth.py → seller_id</text>

  <!-- ============ agentcore runtime ============ -->
  <rect class="aws" x="500" y="225" width="190" height="110"/>
  <text class="t" x="595" y="264">AgentCore Runtime</text>
  <text class="s" x="595" y="285">agentcore_app.py</text>
  <text class="s" x="595" y="305">us-west-2 · ARM64</text>

  <!-- ============ tools ============ -->
  <rect class="hi" x="770" y="225" width="190" height="110"/>
  <text class="t" x="865" y="264">12 tools</text>
  <text class="s" x="865" y="285">find · enrich · score</text>
  <text class="s" x="865" y="305">draft · seller · status</text>

  <!-- ============ datastore ============ -->
  <rect class="box" x="1040" y="240" width="190" height="80"/>
  <text class="t" x="1135" y="272">Supabase Postgres</text>
  <text class="s" x="1135" y="294">leads · runs · drafts</text>

  <!-- ============ supporting ============ -->
  <rect class="hi" x="500" y="60" width="190" height="70"/>
  <text class="t" x="595" y="91">Claude Sonnet 4.5</text>
  <text class="s" x="595" y="111">Amazon Bedrock</text>

  <rect class="box" x="770" y="60" width="190" height="70"/>
  <text class="t" x="865" y="91">SSM Parameter Store</text>
  <text class="s" x="865" y="111">runtime secrets</text>

  <rect class="box" x="770" y="420" width="190" height="70"/>
  <text class="t" x="865" y="451">DataForSEO · SMTP</text>
  <text class="s" x="865" y="471">find · send</text>

  <!-- ============ edges ============ -->
  <path class="ln" d="M 180 280 H 250"/>
  <path class="ln" d="M 420 280 H 500"/>
  <path class="ln" d="M 690 280 H 770"/>
  <path class="ln" d="M 960 280 H 1040"/>
  <path class="ln" d="M 595 225 V 130"/>
  <path class="ln" d="M 650 225 V 190 H 865 V 130"/>
  <path class="ln" d="M 865 335 V 420"/>
  <path class="ln" d="M 1135 320 V 530 H 335 V 320"/>

  <!-- ============ edge labels ============ -->
  <text class="lbl" x="240" y="272" text-anchor="end">start a run</text>
  <text class="lbl" x="460" y="272" text-anchor="middle">/invocations</text>
  <text class="lbl" x="730" y="272" text-anchor="middle">tool calls</text>
  <text class="lbl" x="607" y="180">model</text>
  <text class="lbl" x="880" y="180">secrets at boot</text>
  <text class="lbl" x="1125" y="522" text-anchor="end">progress, events and drafts read back by the dashboard</text>
</svg>
